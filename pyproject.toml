[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opt-hmm"
version = "0.1.0"
description = "Two-stage watermark proportion estimation and HMM localization experiments"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
data = ["datasets>=3,<5", "transformers>=4.51.1,<4.56", "pyarrow>=21"]
inference = ["vllm==0.8.4", "datasets>=3,<5", "transformers>=4.51.1,<4.56", "pyarrow>=21"]

[project.scripts]
opt-hmm = "opt_hmm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
